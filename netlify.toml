# Netlify configuration for Angular app
[build]
  command = "npm ci && npm run build"
  # Angular SSR build produces browser + server. We publish the static browser output.
  publish = "dist/Admin-Dashboard/browser"

[build.environment]
  NODE_VERSION = "20"

# Optional: speed up installs with npm ci cache
# [functions]
#   node_bundler = "esbuild"
